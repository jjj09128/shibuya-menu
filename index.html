<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070c" />
    <title>咒术回战 · 涩谷</title>
  </head>
  <body>
    <div id="scene-root"></div>

    <main class="menu">
      <div class="menu__veil"></div>
      <div class="menu__content">
        <p class="menu__kicker">渋谷事変</p>
        <div class="menu__title-row">
          <h1 class="menu__title">咒术回战</h1>
          <span class="menu__seal" aria-hidden="true">呪</span>
        </div>
        <p class="menu__subtitle">SHIBUYA INCIDENT</p>
        <button id="enter-game" class="enter-btn" type="button">
          <span class="enter-btn__label">进入游戏</span>
        </button>
      </div>
    </main>

    <button
      id="notice-open"
      class="notice-btn"
      type="button"
      aria-haspopup="dialog"
      aria-controls="notice-modal"
    >
      <span class="notice-btn__seal" aria-hidden="true">呪</span>
      <span class="notice-btn__label">公告</span>
    </button>

    <div id="version-tag" class="version-tag"></div>

    <div id="notice-modal" class="modal" hidden>
      <div class="modal__backdrop" data-close></div>
      <section
        class="modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="notice-title"
      >
        <header class="modal__head">
          <p class="modal__kicker">UPDATE LOG</p>
          <h2 id="notice-title" class="modal__title">更新公告</h2>
          <button class="modal__close" type="button" aria-label="关闭公告">×</button>
        </header>
        <div id="notice-list" class="modal__body"></div>
        <footer class="modal__foot">呪術廻戦 · 渋谷事変</footer>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
