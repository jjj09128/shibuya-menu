<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>咒术回战 · 涩谷</title>
    <!-- PWA manifest 由 vite-plugin-pwa 在 build 时注入 -->
    <script type="module" crossorigin src="./assets/index-Dtbzb91C.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-FXP-10kF.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js?v=1792642454"></script></head>
  <body>
    <div id="scene-root"></div>

    <div id="loading-overlay" class="loading" hidden aria-hidden="true">
      <div class="loading__veil"></div>
      <div class="loading__stain" aria-hidden="true"></div>
      <div class="loading__content">
        <p class="loading__kicker">渋谷事変</p>
        <h2 class="loading__title">呪術廻戦</h2>
        <p class="loading__subtitle">SHIBUYA · LOADING</p>
        <div class="loading__bar" id="loading-bar" aria-hidden="true">
          <div class="loading__fill" id="loading-fill"></div>
        </div>
        <p class="loading__hint" id="loading-hint">準備中……</p>
      </div>
      <p class="loading__tip" id="loading-tip">请稍候</p>
    </div>

    <!-- 竖屏提示：手机竖持时盖死画面，强制横屏 -->
    <div class="portrait-overlay" hidden aria-hidden="true">
      <div class="portrait-overlay__veil"></div>
      <div class="portrait-overlay__content">
        <div class="portrait-overlay__icon" aria-hidden="true">
          <div class="portrait-overlay__phone"></div>
          <div class="portrait-overlay__arrow"></div>
        </div>
        <p class="portrait-overlay__text">请横屏游玩</p>
        <p class="portrait-overlay__sub">Rotate your device</p>
      </div>
    </div>

    <main class="menu">
      <div class="menu__veil"></div>
      <div class="menu__content">
        <p class="menu__kicker">渋谷事変</p>
        <div class="menu__title-row">
          <h1 class="menu__title">咒术回战</h1>
          <span class="menu__seal" aria-hidden="true">呪</span>
        </div>
        <p class="menu__subtitle">SHIBUYA INCIDENT</p>
        <button id="enter-game" class="enter-btn" type="button">
          <span class="enter-btn__label">进入游戏</span>
        </button>
      </div>
    </main>

    <div id="game-hud" class="hud" hidden>
      <div class="hud__top">
        <div class="hud__zone">
          <p class="hud__kicker">FREE ROAM</p>
          <p id="hud-zone" class="hud__name">渋谷 · スクランブル交差点</p>
          <p id="hud-coords" class="hud__coords">X 0 · Z 0</p>
        </div>
        <button id="hud-menu" class="hud__menu" type="button">菜单</button>
      </div>
      <p id="hud-hint" class="hud__hint">
        WASD 移动 · Shift 奔跑 · 空格 跳跃 · 鼠标 视角
      </p>
      <p id="hud-lock" class="hud__lock">点击画面锁定鼠标视角</p>
      <div id="pause-overlay" class="pause" hidden>
        <div class="pause__panel">
          <p class="pause__kicker">PAUSED</p>
          <h2 class="pause__title">渋谷探索</h2>
          <button id="pause-resume" class="pause__btn" type="button">继续探索</button>
          <button id="pause-menu" class="pause__btn pause__btn--ghost" type="button">
            返回主菜单
          </button>
        </div>
      </div>
    </div>

    <div id="account-slot" class="account-slot"></div>

    <button
      id="notice-open"
      class="notice-btn"
      type="button"
      aria-haspopup="dialog"
      aria-controls="notice-modal"
    >
      <span class="notice-btn__seal" aria-hidden="true">呪</span>
      <span class="notice-btn__label">公告</span>
    </button>

    <div id="version-tag" class="version-tag"></div>

    <div id="notice-modal" class="modal" hidden>
      <div class="modal__backdrop" data-close></div>
      <section
        class="modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="notice-title"
      >
        <header class="modal__head">
          <p class="modal__kicker">UPDATE LOG</p>
          <h2 id="notice-title" class="modal__title">更新公告</h2>
          <button class="modal__close" type="button" aria-label="关闭公告">×</button>
        </header>
        <div id="notice-list" class="modal__body"></div>
        <footer class="modal__foot">呪術廻戦 · 渋谷事変</footer>
      </section>
    </div>

    <div id="auth-modal" class="modal" hidden>
      <div class="modal__backdrop" data-auth-close></div>
      <section
        class="modal__panel modal__panel--auth"
        role="dialog"
        aria-modal="true"
        aria-labelledby="auth-title"
      >
        <header class="modal__head">
          <p class="modal__kicker">PLAYER ACCOUNT</p>
          <h2 id="auth-title" class="modal__title">玩家账号</h2>
          <button class="modal__close" type="button" data-auth-close aria-label="关闭账号窗口">
            ×
          </button>
        </header>
        <div id="auth-body" class="modal__body"></div>
      </section>
    </div>

    <div id="admin-panel" class="admin" hidden></div>

  </body>
</html>
